spring:
  application:
    name: activity-service

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/tracker_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  jpa:
    hibernate:
      ddl-auto: validate #since after flyway introduction, we need hibernate to validate our schema & not create/update it.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: activity

  jackson:
    serialization:
      INDENT_OUTPUT: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: activity
    default-schema: activity

server:
  port: 8081



# Logging (very useful during dev)
logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{traceId:-},%X{spanId:-}]){yellow} %clr(%-40.40logger{39}){cyan} : %m%n%wEx"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://localhost:9411}/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}

# Swagger/OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    metadata-map:
      zone: ap-south-1
      version: v1

messaging:
  exchange: activity.events
  routing-key: activity.logged

outbox:
  relay:
    delay-ms: 2000

# Session integrity (issue #67). Layer 1 (hard cap) always applies; layer 2 (statistical
# quarantine) is gated by outlier-detection-enabled.
session-integrity:
  outlier-detection-enabled: ${SESSION_INTEGRITY_OUTLIER_ENABLED:true}
  max-duration-minutes: ${SESSION_INTEGRITY_MAX_DURATION:1440}
  modified-z-threshold: ${SESSION_INTEGRITY_Z_THRESHOLD:3.5}
  min-samples: ${SESSION_INTEGRITY_MIN_SAMPLES:10}
  baseline-window: ${SESSION_INTEGRITY_BASELINE_WINDOW:100}
  relative-factor: ${SESSION_INTEGRITY_RELATIVE_FACTOR:3.0}
  # Flags regardless of the user's own baseline -- closes the self-consistency hole where a
  # consistently implausible user is never an outlier against their own history.
  absolute-flag-minutes: ${SESSION_INTEGRITY_ABSOLUTE_FLAG_MINUTES:600}
  # A day physically contains 1440 minutes; closes aggregate farming via many small sessions.
  max-daily-minutes: ${SESSION_INTEGRITY_MAX_DAILY_MINUTES:1440}
