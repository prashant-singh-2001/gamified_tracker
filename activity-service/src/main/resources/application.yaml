spring:
  application:
    name: activity-service

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/tracker_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  jpa:
    hibernate:
      ddl-auto: validate #since after flyway introduction, we need hibernate to validate our schema & not create/update it.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: activity

  jackson:
    serialization:
      INDENT_OUTPUT: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: activity
    default-schema: activity

  # AI weekly coaching digest (issue #65).
  # none | ollama | openai. `none` (default) creates NO chat model bean, so both starters stay
  # inert -- this is what keeps ActivityServiceApplicationTests and the CI compose gate green.
  # `openai` means any OpenAI-compatible server (Docker Model Runner, vLLM, LocalAI), not the
  # hosted OpenAI API -- it is pointed at base-url below.
  #
  # ALL SIX must be listed, not just chat/embedding: the openai starter ships six independent
  # autoconfigurations (chat, embedding, image, audio.speech, audio.transcription, moderation),
  # each individually `matchIfMissing = true` -- confirmed by decompiling
  # spring-ai-autoconfigure-model-openai-1.1.8.jar. Any one left unset activates targeting OpenAI
  # and fails at context startup on a missing API key. Ollama's chat/embedding autoconfigs are
  # ALSO matchIfMissing=true, so `chat` specifically must never be left unset while both starters
  # are on the classpath: unset activates Ollama's AND OpenAI's chat autoconfiguration
  # simultaneously (matchIfMissing bypasses the differing havingValue), a guaranteed
  # NoUniqueBeanDefinitionException, not just an ambiguity.
  ai:
    model:
      chat: ${INSIGHTS_CHAT_PROVIDER:none}
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never   # never contact the server at startup
      chat:
        model: ${OLLAMA_MODEL:llama3.2}
        options:
          temperature: ${INSIGHTS_TEMPERATURE:0.4}
    openai:
      # Docker Model Runner: http://localhost:12434/engines/v1 from the host,
      # http://model-runner.docker.internal/engines/v1 from inside a container.
      base-url: ${INSIGHTS_OPENAI_BASE_URL:http://localhost:12434/engines/v1}
      # Required by the starter, ignored by a local server. Real value only if you ever point this
      # at a hosted provider -- which CI must never need.
      api-key: ${INSIGHTS_OPENAI_API_KEY:not-needed}
      chat:
        model: ${INSIGHTS_OPENAI_MODEL:ai/gemma3}
        options:
          temperature: ${INSIGHTS_TEMPERATURE:0.4}

  # activity-service makes no other outbound HTTP call (Feign was removed in #16), so this bounds
  # the model call specifically. Belt-and-braces -- the service catches everything regardless.
  http:
    client:
      connect-timeout: ${INSIGHTS_CONNECT_TIMEOUT:2s}
      read-timeout: ${INSIGHTS_READ_TIMEOUT:20s}

server:
  port: 8081



# Logging (very useful during dev)
logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{traceId:-},%X{spanId:-}]){yellow} %clr(%-40.40logger{39}){cyan} : %m%n%wEx"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://localhost:9411}/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}

# Swagger/OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    metadata-map:
      zone: ap-south-1
      version: v1

messaging:
  exchange: activity.events
  routing-key: activity.logged

outbox:
  relay:
    delay-ms: 2000

# Session integrity (issue #67). Layer 1 (hard cap) always applies; layer 2 (statistical
# quarantine) is gated by outlier-detection-enabled.
session-integrity:
  outlier-detection-enabled: ${SESSION_INTEGRITY_OUTLIER_ENABLED:true}
  max-duration-minutes: ${SESSION_INTEGRITY_MAX_DURATION:1440}
  modified-z-threshold: ${SESSION_INTEGRITY_Z_THRESHOLD:3.5}
  min-samples: ${SESSION_INTEGRITY_MIN_SAMPLES:10}
  baseline-window: ${SESSION_INTEGRITY_BASELINE_WINDOW:100}
  relative-factor: ${SESSION_INTEGRITY_RELATIVE_FACTOR:3.0}
  # Flags regardless of the user's own baseline -- closes the self-consistency hole where a
  # consistently implausible user is never an outlier against their own history.
  absolute-flag-minutes: ${SESSION_INTEGRITY_ABSOLUTE_FLAG_MINUTES:600}
  # A day physically contains 1440 minutes; closes aggregate farming via many small sessions.
  max-daily-minutes: ${SESSION_INTEGRITY_MAX_DAILY_MINUTES:1440}

# Fuzzy activity-name resolution (issue #66). auto-resolve-enabled is a kill switch for the
# automatic substitution ONLY -- ranked suggestions on a 404 are unaffected by it.
activity-name-matching:
  auto-resolve-enabled: ${ACTIVITY_NAME_AUTO_RESOLVE_ENABLED:true}
  # Just above the 0.85 record-linkage convention for "high-confidence Jaro-Winkler", and above
  # ActivityMatcher.DESCRIPTION_WEIGHT (0.8) -- so a description hit structurally CANNOT
  # auto-resolve, only a name hit can.
  auto-resolve-threshold: ${ACTIVITY_NAME_AUTO_RESOLVE_THRESHOLD:0.86}
  # Two catalog names one edit apart land ~0.03 apart ("Studyng" -> Study 0.943, Studying 0.975);
  # 0.05 catches that band and refuses to guess.
  ambiguity-margin: ${ACTIVITY_NAME_AMBIGUITY_MARGIN:0.05}
  suggestion-threshold: ${ACTIVITY_NAME_SUGGESTION_THRESHOLD:0.45}
  max-suggestions: ${ACTIVITY_NAME_MAX_SUGGESTIONS:3}

# AI weekly coaching digest (issue #65). Default OFF and no model backend selected: CI has no model
# server and no secrets, and the compose health gate must stay green. When off, /insights/weekly
# still returns all the numbers -- only `narrative` goes null. The model narrates; every number is
# computed in Java. (Backend selection itself lives under spring.ai.model.chat at the top of this
# file, alongside the rest of the spring: block.)
insights:
  enabled: ${INSIGHTS_ENABLED:false}
  max-notes: ${INSIGHTS_MAX_NOTES:20}
  max-note-chars: ${INSIGHTS_MAX_NOTE_CHARS:280}
  max-narrative-chars: ${INSIGHTS_MAX_NARRATIVE_CHARS:1200}
