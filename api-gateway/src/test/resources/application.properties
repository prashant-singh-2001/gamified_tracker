spring.datasource.url=jdbc:h2:mem:testdb;INIT=CREATE SCHEMA IF NOT EXISTS GATEWAY;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=null
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# JWT Configuration (for tests)
jwt.secret=test-secret-key-for-unit-tests-only
jwt.expiration=900000

# Same as activity-service and gamification-service: tests build the schema from the entities
# (ddl-auto above), and migrations are Postgres SQL that H2 cannot run (DO blocks, function-based
# indexes). A green test therefore does not prove a migration -- that is checked against real
# Postgres (CI's docker compose gate).
spring.flyway.enabled=false
