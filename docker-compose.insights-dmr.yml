# Docker Model Runner backend for the AI features: the weekly coaching digest (issue #65) and natural-language
# activity logging (issue #70). An alternative to the Ollama profile in docker-compose.yml, for anyone who
# already has Docker Desktop Model Runner and would rather not run a second container. It switches both
# features on and pulls ai/granite4.2.
#
#   docker compose -f docker-compose.yml -f docker-compose.insights-dmr.yml up -d
#
# Kept OUT of docker-compose.yml deliberately: the top-level `models:` element needs Compose 2.38+,
# and an unrecognised top-level key would break EVERY compose command on an older Compose --
# including the `up -d` that CI's health gate depends on. A separate file means the main stack
# cannot regress on that. Docker Model Runner is also a Docker Desktop feature, not guaranteed on
# a Linux CI runner, which is a second reason this never becomes part of the default stack.
models:
  digest_model:
    model: ai/granite4.2

services:
  activity:
    models:
      digest_model:
        # Compose injects the running model's endpoint into this env var, but as http://.../v1/, and Spring AI
        # appends /v1/chat/completions itself, which then 404s ("backend not found"). So the endpoint goes to a
        # variable nothing reads, and INSIGHTS_OPENAI_BASE_URL is set explicitly below.
        endpoint_var: DMR_ENDPOINT
        # The model name above, injected so it lives in one place.
        model_var: INSIGHTS_OPENAI_MODEL
    environment:
      - INSIGHTS_OPENAI_BASE_URL=http://model-runner.docker.internal/engines
      - INSIGHTS_ENABLED=true
      - INSIGHTS_CHAT_PROVIDER=openai
      - NATURAL_LOG_ENABLED=true
      # Model Runner loads the model on the first request, which can take 20+ seconds: the default 20s
      # read timeout would report UNAVAILABLE once. 60s covers a cold start.
      - INSIGHTS_READ_TIMEOUT=60s
