spring:
  application:
    name: gamification-service

  output:
    ansi:
      enabled: ALWAYS

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
        default-requeue-rejected: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/tracker_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: gamification

  jackson:
    serialization:
      INDENT_OUTPUT: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: gamification
    default-schema: gamification

server:
  port: 8082

# Logging (very useful during dev)
logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{traceId:-},%X{spanId:-}]){yellow} %clr(%-40.40logger{39}){cyan} : %m%n%wEx"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://localhost:9411}/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}

# Swagger/OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    metadata-map:
      zone: ap-south-1
      version: v1

messaging:
  exchange: activity.events
  routing-key: activity.logged
  queue: gamification.activity-logged.q
  dlx: activity.events.dlx
  dlq: gamification.activity-logged.dlq

ranking:
  # Cadence for RankRecomputeServiceImpl's scheduled re-rank; externalized so it can be
  # tuned per environment (e.g. faster for local/demo) without a rebuild.
  recompute-interval-ms: ${RANKING_RECOMPUTE_INTERVAL_MS:30000}
  # Must stay below the interval so a crashed instance lock never blocks the next legitimate tick.
  lock-at-most-for: ${RANKING_LOCK_AT_MOST_FOR:PT25S}
  # Fluid ranks (issue 135): a rank is a percentile of recency-decayed XP, not lifetime XP. XP halves
  # in weight every half-life-days.
  half-life-days: ${RANKING_HALF_LIFE_DAYS:14}
  # How long a movement baseline lives before it is rolled forward: the horizon of "up 3 places".
  movement-window-hours: ${RANKING_MOVEMENT_WINDOW_HOURS:24}

leveling:
  default-curve:
    # Kill switch: false restores the old "unseeded activity stays level 1 forever" behavior
    # without a rollback. xpRequiredFor(level) = base-xp * (level - 1) ^ exponent.
    enabled: true
    base-xp: 100.0
    exponent: 1.5
    max-level: 100